<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planogramas Ponce & Benzo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Carlito:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("pb-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
/* Layout: banda índigo de marca arriba; debajo, lista a la izquierda y ficha a la derecha. Una sola categoría visible a la vez para que la ficha sea corta. */
:root{
  --indigo:#1E2D7D; --indigo-ink:#14205E; --indigo-soft:#E9ECF8; --indigo-line:#C9CFEE; --peri:#A3AFEF;
  --bg:#F3F5F6; --panel:#FFFFFF; --ink:#121516; --muted:#677279; --line:#E1E3E4;
  --hit:#E60023; --ok:#1F8A4C; --warn-bg:#FFF5DB; --warn-ink:#7A5200;
  --c-b:#B8457A; --c-d:#2F6FD0; --c-s:#2E8B57; --c-p:#0E8A8C; --c-v:#C27A0E;
  --f-display:Arial,"Arimo","Helvetica Neue",Helvetica,sans-serif;
  --f-body:Calibri,"Carlito","Segoe UI",system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --indigo:#2B3C9A; --indigo-ink:#C9D0FF; --indigo-soft:#1C2347; --indigo-line:#323D78; --peri:#A3AFEF;
  --bg:#0E1117; --panel:#161A23; --ink:#E8EAF0; --muted:#9AA3B5; --line:#272D3A;
  --hit:#FF4D6A; --ok:#4CC782; --warn-bg:#3A2E10; --warn-ink:#F3D27A;
  --c-b:#E07AAB; --c-d:#6FA6FF; --c-s:#5FCB8C; --c-p:#4FC9CB; --c-v:#F0B04A; color-scheme:dark}}
:root[data-theme="dark"]{
  --indigo:#2B3C9A; --indigo-ink:#C9D0FF; --indigo-soft:#1C2347; --indigo-line:#323D78; --peri:#A3AFEF;
  --bg:#0E1117; --panel:#161A23; --ink:#E8EAF0; --muted:#9AA3B5; --line:#272D3A;
  --hit:#FF4D6A; --ok:#4CC782; --warn-bg:#3A2E10; --warn-ink:#F3D27A;
  --c-b:#E07AAB; --c-d:#6FA6FF; --c-s:#5FCB8C; --c-p:#4FC9CB; --c-v:#F0B04A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.in{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--peri);outline-offset:2px}

/* banda de marca */
.brand{background:var(--indigo);color:#fff}
.brand .in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-block:22px 0}
.mark{display:flex;align-items:center;gap:14px;padding-bottom:18px}
.mark .sq{width:42px;height:42px;border:2px solid #fff;display:grid;place-items:center;flex:none}
.mark .sq i{display:block;width:26px;height:26px;background:linear-gradient(135deg,transparent 49%,#fff 50%)}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--peri);font-weight:500}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
.stats{display:flex;gap:26px;padding-bottom:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1}
.stats span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--peri);margin-top:4px}
.tabs{flex:1 1 100%;display:flex;gap:4px;align-items:flex-end}
.tabs .sp{flex:1}
.theme{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:6px 14px 6px 10px;font-size:.88rem;cursor:pointer}
.theme:hover{background:rgba(255,255,255,.16)}
.theme svg{width:16px;height:16px}
.tab{border:0;background:transparent;color:#C9D0FF;padding:11px 18px 12px;font-weight:500;font-size:.95rem;border-radius:10px 10px 0 0;cursor:pointer}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--bg);color:var(--indigo-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--ink)}}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--ink)}

/* líneas */
.lines{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:18px 14px}
.lines .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--indigo-line)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.lines .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);cursor:pointer;border:0;background:none;padding:4px}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--hit)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}

/* grilla */
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:40px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:900px){aside{position:static;max-height:none}}
.filters{padding:14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.filters input,.filters select{width:100%;font:inherit;font-size:.92rem;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.filters .row{display:flex;gap:8px}.filters .row>*{flex:1;min-width:0}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes .chip{padding:4px 10px;font-size:.8rem}
.count{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.clear{border:0;background:var(--indigo-soft);color:var(--indigo-ink);border-radius:99px;padding:2px 9px;font-size:.76rem;cursor:pointer}
ul.list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
@media (max-width:900px){ul.list{max-height:340px}}
.li{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;cursor:pointer}
.li:hover{background:var(--bg)}
.li:focus-visible{outline:2px solid var(--peri)}
.li[aria-current="true"]{background:var(--indigo-soft)}
.li .t{flex:1;min-width:0}
.li .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li .m{font-size:.78rem;color:var(--muted)}
.wk{display:flex;gap:3px;flex:none}
.wk i{font-style:normal;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;font-weight:700;color:var(--muted);background:var(--bg)}
.wk i.on{background:var(--indigo);color:#fff}
.grp{list-style:none;padding:12px 10px 4px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{padding:22px;color:var(--muted)}

/* ficha */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.hero{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1.05;margin:4px 0 6px}
.hero .sub{color:var(--muted);font-size:.92rem}
.hero .sub code{font-family:var(--f-mono);font-size:.85em}
.big{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.big{text-align:left}}
.big b{display:block;font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;color:var(--indigo-ink)}
.big span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cendis{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.cendis .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;width:100%}
.days{display:grid;grid-template-columns:repeat(6,minmax(64px,1fr));gap:6px;flex:1 1 440px}
@media (max-width:520px){.days{grid-template-columns:repeat(3,1fr)}}
.day{border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;font-size:.78rem;color:var(--muted);line-height:1.3;font-variant-numeric:tabular-nums}
.day b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.day.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.day.today{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--hit)}
.next{font-size:.9rem;display:flex;align-items:center;gap:8px}
.next .pin{width:10px;height:10px;border-radius:50%;background:var(--hit)}
.next b{font-weight:700}

/* categorías */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cat{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.cat:hover{border-color:var(--indigo-line)}
.cat:focus-visible{outline:2px solid var(--peri)}
.cat .cn{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:500;color:var(--muted)}
.cat .cm{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.15;font-variant-numeric:tabular-nums}
.cat .cc{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.cat .cf{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cat .cp{font-size:.72rem;font-weight:700;color:var(--hit);white-space:nowrap}
.cat[aria-pressed="true"]{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo);background:var(--indigo-soft)}
.cat[disabled]{cursor:default;opacity:.55}

/* planograma */
.plan{overflow:hidden}
.ph{padding:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line)}
.ph .k{display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.ph h3{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:4px 0 0;line-height:1.15}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;font-variant-numeric:tabular-nums}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.facts code{font-family:var(--f-mono);font-size:.88em}
.plan > .notes:first-child{padding-top:16px}
.notes{padding:12px 22px 0;display:flex;flex-direction:column;gap:6px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 12px;font-size:.86rem}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
@media (max-width:1100px){.pbody{grid-template-columns:minmax(0,1fr)}}
.viewc{padding:14px 22px 22px;min-width:0}
.vtools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.btn:hover{border-color:var(--indigo-line)}
.imgb{all:unset;display:block;cursor:zoom-in;width:100%}
.frame{position:relative;margin:0 auto;max-width:100%}
.frame img{display:block;width:100%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--line)}
.hit{position:absolute;border:3px solid var(--hit);border-radius:4px;box-shadow:0 0 0 2px #fff,0 0 12px var(--hit);pointer-events:none}
.hit.dim{opacity:.22}
@media (prefers-reduced-motion:no-preference){.hit.on{animation:pulse 1.1s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 2px #fff,0 0 22px 6px var(--hit)}}
.side{border-left:1px solid var(--line);padding:16px 16px 20px;background:var(--bg)}
@media (max-width:1100px){.side{border-left:0;border-top:1px solid var(--line)}}
.side h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hit)}
.side .hint{font-size:.78rem;color:var(--muted);margin:0 0 10px}
.prods{display:flex;flex-direction:column;gap:8px}
@media (max-width:1100px){.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.pr{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.pr:hover{border-color:var(--indigo-line)}
.pr:focus-visible{outline:2px solid var(--peri)}
.pr[aria-pressed="true"]{border-color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)}
.pr .ph2{width:56px;height:56px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.pr .ph2 img{width:100%;height:100%;object-fit:contain}
.pr .ph2 span{font-family:var(--f-display);font-size:1.3rem;color:var(--indigo)}
.pr .pn{font-size:.86rem;font-weight:500;line-height:1.25}
.pr .ps{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:2px}
.pr .pk{font-size:.74rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.pr .pk b{color:var(--ink);font-weight:500}
.zero{color:var(--hit)!important;font-weight:700!important}
.noimg{padding:28px 22px;color:var(--muted)}

/* resumen y tablas */
.sec{padding:18px 22px}
.sec h3{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0}
.sec p.d{color:var(--muted);font-size:.86rem;margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.05;color:var(--indigo-ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px}
.bars h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:.92rem}
.brow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 56px 120px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:.84rem;width:100%;font-variant-numeric:tabular-nums}
.brow:hover{background:var(--bg)}
.brow:focus-visible{outline:2px solid var(--peri)}
.brow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bm{color:var(--muted);text-align:right}
.brow .bb{display:flex;align-items:center;gap:6px}
.brow .bb i{display:block;height:8px;border-radius:4px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tw.sc{max-height:380px}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td code{font-family:var(--f-mono);font-size:.8rem}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
tr.click:focus-visible td{outline:2px solid var(--peri);outline-offset:-2px}
.tprod{display:flex;align-items:center;gap:10px}
.tprod img,.tprod span.ph3{width:34px;height:34px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none}
.tprod span.ph3{display:grid;place-items:center;font-family:var(--f-display);color:var(--indigo)}
.back{align-self:flex-start}
footer{color:var(--muted);font-size:.78rem;padding-block:0 30px}

/* visor */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.93);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));color:#fff;flex-wrap:wrap}
.vbar strong{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.vbar .btn{background:#1B2350;color:#fff;border-color:#3A4580}
.vscroll{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 12px 12px}
.vframe{position:relative;display:inline-block;max-width:100%;line-height:0}
.vscroll img{background:#fff;border-radius:6px;max-width:100%;max-height:calc(100dvh - 90px);cursor:zoom-in;display:block}
.vscroll.real{display:block}
.vscroll.real img{max-width:none;max-height:none;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.li,.chip,.cat,.pr,.brow,tr.click td{transition:background .12s,border-color .12s}}
</style>

</head>
<body>
<header class="brand">
  <div class="in">
    <div class="mark">
      <div class="sq" aria-hidden="true"><i></i></div>
      <div><div class="eyebrow">Ponce &amp; Benzo · Laboratorios Ponce</div><h1>Planogramas Farmatodo</h1></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist" aria-label="Vista">
      <button type="button" class="tab" role="tab" data-mode="tienda" aria-selected="true">Por tienda</button>
      <button type="button" class="tab" role="tab" data-mode="plan" aria-selected="false">Por planograma</button>
      <span class="sp"></span>
      <button type="button" class="theme" id="theme"></button>
    </div>
  </div>
</header>

<div class="in">
  <nav class="lines" id="lines" aria-label="Línea de producto Ponce"></nav>
  <div class="grid">
    <aside class="card" aria-label="Lista">
      <div class="filters">
        <input id="q" type="search" autocomplete="off">
        <div class="row" id="trow">
          <select id="city" aria-label="Ciudad"><option value="">Ciudad</option></select>
          <select id="dia" aria-label="Día de Cendis"><option value="">Día Cendis</option><option value="0">Lunes</option><option value="1">Martes</option><option value="2">Miércoles</option><option value="3">Jueves</option><option value="4">Viernes</option><option value="5">Sábado</option></select>
        </div>
        <div class="sizes" id="sizes" hidden></div>
        <div class="count"><span id="count"></span><button type="button" class="clear" id="clear" hidden></button></div>
      </div>
      <ul class="list" id="list"></ul>
    </aside>
    <main id="main"></main>
  </div>
  <footer>Fuentes: carpeta PLANOGRAMAS (PDF de cada planograma y asignaciones tienda–anaquel), «Ponce y Benzo Stock» (4-nov-26) y «Días de reabastecimiento a tienda FTD». Fotos de producto: ponce-benzo.com.</footer>
</div>

const PL = DATA.pl, STORES = DATA.stores, PONCE = DATA.ponce || {}, STOCK = DATA.stock || {}, PIMG = DATA.pimg || {};
const CATS = [
  {k:'b', name:'Bebé Cosméticos'}, {k:'d', name:'Desodorantes'}, {k:'s', name:'Salud en Forma'},
  {k:'p', name:'Primeros Auxilios'}, {k:'v', name:'Vitaminas'}];
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'], DL = ['L','M','X','J','V','S'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => Number(n).toLocaleString('es-VE');
const fmtM = cm => (cm/100).toFixed(2).replace('.',',') + ' m';
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const catOf = code => CATS.find(c => c.name === PL[code].cat);
const cvar = k => `var(--c-${k})`;
const wOf = (s,c) => s[c.k] ? PL[s[c.k]].width_cm : 0;
const CATOF = {}; Object.values(PL).forEach(p => { const c = CATS.find(c=>c.name===p.cat); (p.ponce||[]).forEach(h => (CATOF[PONCE[h[0]].l] ||= new Set()).add(c.k)); });
const firstCat = l => Math.min(...[...CATOF[l]].map(k => CATS.findIndex(c=>c.k===k)));
const LINES = Object.keys(CATOF).sort((a,b) => firstCat(a)-firstCat(b) || a.localeCompare(b,'es'));
const STORESOF = {}; STORES.forEach(s => CATS.forEach(c => { if (s[c.k]) (STORESOF[s[c.k]] ||= []).push(s); }));
const SIZES = [...new Set(Object.values(PL).map(p=>p.width_cm))].sort((a,b)=>a-b);
const todayIdx = (() => { const d = new Date().getDay(); return d === 0 ? -1 : d - 1; })();

let mode = 'tienda', sel = null, selPg = null, selCat = null, pgFilter = null, line = null, hiSku = null, hiOn = true, view = 'foto', size = null;
try { view = localStorage.getItem('pb-view') || 'foto'; const l = localStorage.getItem('pb-line'); if (l && CATOF[l]) line = l; } catch(e) {}
const visCats = () => line ? CATS.filter(c => CATOF[line].has(c.k)) : CATS;

function prodThumb(sku, cls){ return PIMG[sku] ? `<img src="${PIMG[sku]}" alt="" loading="lazy"${cls?` class="${cls}"`:''}>` : `<span class="${cls||''}">${esc((PONCE[sku]?.l||'?')[0])}</span>`; }
function weekDots(s){ return `<span class="wk" aria-label="Cendis: ${s.r?DIAS.filter((_,i)=>s.r[i]).join(', '):'sin datos'}">${DL.map((d,i)=>`<i class="${s.r&&s.r[i]?'on':''}">${d}</i>`).join('')}</span>`; }
function nextCendis(s){
  if (!s.r) return null;
  if (todayIdx >= 0 && s.r[todayIdx]) return {txt:'Hoy le toca Cendis', when:s.r[todayIdx]};
  for (let k=1;k<=7;k++){ const i=(todayIdx+k+7)%7; if (i<6 && s.r[i]) return {txt:`Próximo Cendis: ${DIAS[i]}${k===1?' (mañana)':''}`, when:s.r[i]}; }
  return null;
}

/* ---------- cabecera ---------- */
(function(){
  const total = STORES.reduce((a,s)=>a+CATS.reduce((x,c)=>x+wOf(s,c),0),0);
  $('#stats').innerHTML = `<div><b>${STORES.length}</b><span>Tiendas</span></div><div><b>${Object.keys(PL).length}</b><span>Planogramas</span></div><div><b>${nf(Math.round(total/100))} m</b><span>Lineales</span></div>`;
  const cities = [...new Set(STORES.map(s=>s.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  $('#city').insertAdjacentHTML('beforeend', cities.map(c=>`<option>${esc(c)}</option>`).join(''));
})();
function renderLines(){
  const b = (l, label, color) => `<button type="button" class="chip" data-line="${esc(l)}" aria-pressed="${(line||'')===l}">${color?`<span class="dot" style="background:${color}"></span>`:''}${esc(label)}</button>`;
  $('#lines').innerHTML = `<span class="lbl">Línea Ponce</span>` + b('', 'Todas') + LINES.map(l => b(l, l, cvar([...CATOF[l]][0]))).join('')
    + `<span class="sp"></span><button type="button" class="toggle" id="hitoggle" aria-pressed="${hiOn}"><span class="sw"></span>Resaltar en la imagen</button>`;
}

/* ---------- lista ---------- */
function filteredStores(){
  const q = slug($('#q').value.trim()), c = $('#city').value, d = $('#dia').value;
  return STORES.filter(s => (!q || slug(s.n).includes(q) || (s.id||'').includes(q)) && (!c || s.c===c) && (d==='' || (s.r && s.r[+d]))
    && (!pgFilter || CATS.some(x => s[x.k]===pgFilter)) && (!line || [...CATOF[line]].some(k => s[k])));
}
function filteredPg(){
  const q = slug($('#q').value.trim()), vis = visCats().map(c=>c.name);
  return Object.keys(PL).filter(k => vis.includes(PL[k].cat) && (!size || PL[k].width_cm===size) && (!q || slug(PL[k].name).includes(q) || slug(k).includes(q)))
    .sort((a,b) => CATS.indexOf(catOf(a))-CATS.indexOf(catOf(b)) || (STORESOF[b]||[]).length-(STORESOF[a]||[]).length);
}
function renderList(){
  const cl = $('#clear');
  if (mode === 'plan') {
    const codes = filteredPg(); $('#count').textContent = `${codes.length} ${codes.length===1?'planograma':'planogramas'}`; cl.hidden = true;
    $('#sizes').innerHTML = [null,...SIZES].map(w=>`<button type="button" class="chip" data-size="${w||''}" aria-pressed="${size===w}">${w?fmtM(w):'Todas'}</button>`).join('');
    let last = null, h = '';
    codes.forEach(k => { const c = catOf(k), n = (STORESOF[k]||[]).length;
      if (c !== last) { h += `<li class="grp" style="color:${cvar(c.k)}">${c.name}</li>`; last = c; }
      h += `<li><button type="button" class="li" data-pg="${k}" aria-current="${selPg===k}"><span class="cdot" style="background:${cvar(c.k)}"></span><span class="t"><span class="n">${esc(PL[k].name)}</span><span class="m">${fmtM(PL[k].width_cm)} · ${n} ${n===1?'tienda':'tiendas'}</span></span></button></li>`; });
    $('#list').innerHTML = h || '<li class="empty">Ningún planograma coincide.</li>';
    return;
  }
  const rows = filteredStores(); $('#count').textContent = `${rows.length} ${rows.length===1?'tienda':'tiendas'}`;
  cl.hidden = !pgFilter; if (pgFilter) cl.textContent = PL[pgFilter].name + ' ✕';
  $('#list').innerHTML = rows.map(s => `<li><button type="button" class="li" data-n="${esc(s.n)}" aria-current="${sel&&sel.n===s.n}"><span class="t"><span class="n">${esc(s.n)}</span><span class="m">${s.id?'#'+s.id:''}${s.c?' · '+esc(s.c):''}</span></span>${weekDots(s)}</button></li>`).join('')
    || '<li class="empty">Ninguna tienda coincide con la búsqueda.</li>';
}

/* ---------- planograma ---------- */
function hits(code, key){
  const p = PL[code]; if (!hiOn || !p.ponce) return '';
  const i = key==='foto' ? 1 : 2;
  return p.ponce.filter(h => !line || PONCE[h[0]].l===line).map(h => { const b = h[i], px = Math.max(0,(2.4-b[2])/2)+.3, py = .6;
    return `<span class="hit${hiSku ? (h[0]===hiSku?' on':' dim') : ''}" style="left:${b[0]-px}%;top:${b[1]-py}%;width:${b[2]+2*px}%;height:${b[3]+2*py}%"></span>`; }).join('');
}
function planCard(code, noHead){
  const p = PL[code], c = catOf(code);
  const head = `<div class="ph"><div><div class="k" style="color:${cvar(c.k)}"><span class="cdot" style="background:${cvar(c.k)}"></span>${c.name}</div><h3>${esc(p.name)}</h3></div>
    <dl class="facts"><div><dt>Largo</dt><dd>${fmtM(p.width_cm)}</dd></div><div><dt>Módulos</dt><dd>${p.modulos}</dd></div><div><dt>Código</dt><dd><code>${p.code}</code></dd></div>${p.img?`<div><dt>SKU</dt><dd>${p.skus}</dd></div><div><dt>Actualizado</dt><dd>${p.date}</dd></div>`:''}</dl></div>`;
  if (!p.img) return `<section class="card plan">${noHead?'':head}<p class="noimg">Este planograma está asignado, pero su PDF no está en la carpeta PLANOGRAMAS.</p></section>`;
  const cnt = {}; (p.ponce||[]).forEach(h => { if (!line || PONCE[h[0]].l===line) cnt[h[0]] = (cnt[h[0]]||0)+1; });
  const skus = Object.keys(cnt).sort((a,b) => PONCE[a].p.localeCompare(PONCE[b].p,'es'));
  const r = p.dim[view][0]/p.dim[view][1];
  return `<section class="card plan">${noHead?'':head}
    ${p.notes.length?`<div class="notes">${p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}</div>`:''}
    <div class="pbody">
      <div class="viewc">
        <div class="vtools"><div class="seg" role="group" aria-label="Vista"><button type="button" data-view="foto" aria-pressed="${view==='foto'}">Productos</button><button type="button" data-view="sku" aria-pressed="${view==='sku'}">Códigos SKU</button></div>
          <button class="btn" type="button" data-open="${code}">Ampliar ⤢</button></div>
        <button type="button" class="imgb" data-open="${code}" aria-label="Ampliar ${esc(p.name)}"><div class="frame" style="width:min(100%, ${Math.round(620*r)}px)"><img src="${p.img[view]}" width="${p.dim[view][0]}" height="${p.dim[view][1]}" alt="Planograma ${esc(p.name)}" loading="lazy">${hits(code, view)}</div></button>
      </div>
      <div class="side"><h4>Productos Ponce · ${skus.length}</h4><p class="hint">Toca un producto para ubicarlo en la imagen.</p>
        <div class="prods">${skus.map(s => { const k = STOCK[s]; return `<button type="button" class="pr" data-sku="${s}" aria-pressed="${hiSku===s}"><span class="ph2">${prodThumb(s)}</span><span><span class="pn" style="display:block">${esc(PONCE[s].p)}</span><span class="ps" style="display:block">SKU ${s} · ${cnt[s]} ${cnt[s]===1?'posición':'posiciones'}</span>${k?`<span class="pk" style="display:block">Stock: tiendas <b>${nf(k.st)}</b> · Cendis <b class="${k.sc?'':'zero'}">${nf(k.sc)}</b></span>`:''}</span></button>`; }).join('') || '<p class="hint">No hay productos de esta línea en el planograma.</p>'}</div>
      </div>
    </div></section>`;
}

/* ---------- vistas ---------- */
function summary(){
  const cnt = {}; STORES.forEach(s => CATS.forEach(c => { if (s[c.k]) cnt[s[c.k]] = (cnt[s[c.k]]||0)+1; }));
  const nPon = Object.values(PL).filter(p => (p.ponce||[]).length).length;
  const blocks = visCats().map(c => { const codes = Object.keys(PL).filter(k => PL[k].cat===c.name).sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));
    const max = Math.max(...codes.map(k=>cnt[k]||0),1);
    return `<div><h4><span class="cdot" style="background:${cvar(c.k)}"></span>${c.name}</h4>${codes.map(k => `<button type="button" class="brow" data-pgrow="${k}"><span class="bn">${esc(PL[k].name)}</span><span class="bm">${fmtM(PL[k].width_cm)}</span><span class="bb"><i style="width:${Math.max(3,(cnt[k]||0)/max*80)}px;background:${cvar(c.k)}"></i>${cnt[k]||0}</span></button>`).join('')}</div>`; }).join('');
  const skus = Object.keys(STOCK).filter(s => !line || PONCE[s]?.l===line).sort((a,b)=>(PONCE[a]?.l||'').localeCompare(PONCE[b]?.l||'','es') || (PONCE[a]?.p||'').localeCompare(PONCE[b]?.p||'','es'));
  return `<div class="kpis">
      <div class="kpi"><b>${STORES.length}</b><span>tiendas Farmatodo</span></div>
      <div class="kpi"><b>${Object.keys(PL).length}</b><span>planogramas en 5 categorías</span></div>
      <div class="kpi"><b>${nPon}</b><span>planogramas con productos Ponce</span></div>
      <div class="kpi"><b>${STORES.filter(s=>s.r&&todayIdx>=0&&s.r[todayIdx]).length}</b><span>tiendas reciben Cendis hoy</span></div></div>
    <section class="card sec"><h3>Asignación de planogramas</h3><p class="d">De mayor a menor número de tiendas. ${mode==='plan'?'Toca uno para ver su imagen y sus tiendas.':'Toca uno para filtrar la lista de tiendas.'}</p><div class="bars">${blocks}</div></section>
    <section class="card sec"><h3>Stock de productos Ponce${line?' · '+esc(line):''}</h3><p class="d">Unidades en tiendas y disponibles en el Cendis. En rojo, sin stock en el Cendis.</p>
      <div class="tw"><table><thead><tr><th>Producto</th><th>Línea</th><th>SKU</th><th class="n">Tiendas asociadas</th><th class="n">Stock tiendas</th><th class="n">Stock Cendis</th></tr></thead><tbody>
      ${skus.map(s => { const k = STOCK[s], p = PONCE[s] || {p:k.d,l:''}; return `<tr><td><span class="tprod">${PIMG[s]?`<img src="${PIMG[s]}" alt="">`:`<span class="ph3">${esc((p.l||'?')[0])}</span>`}${esc(p.p)}</span></td><td>${esc(p.l)}</td><td><code>${s}</code></td><td class="n">${nf(k.t)}</td><td class="n">${nf(k.st)}</td><td class="n ${k.sc?'':'zero'}">${nf(k.sc)}</td></tr>`; }).join('')}
      </tbody></table></div></section>`;
}
function storeView(){
  const s = sel, vc = visCats(), total = CATS.reduce((a,c)=>a+wOf(s,c),0), nx = nextCendis(s);
  if (!selCat || !vc.some(c=>c.k===selCat) || !s[selCat]) selCat = (vc.find(c=>s[c.k]) || vc[0]).k;
  const ponceIn = code => code && PL[code].ponce ? new Set(PL[code].ponce.filter(h=>!line||PONCE[h[0]].l===line).map(h=>h[0])).size : 0;
  return `<section class="card hero">
      <div><div class="eyebrow" style="color:var(--muted)">Tienda Farmatodo</div><h2>${esc(s.n)}</h2>
        <div class="sub">${s.id?`<code>#${s.id}</code>`:''}${s.c?' · '+esc(s.c):''}${s.a?' · '+esc(s.a):''}</div></div>
      <div class="big"><b>${fmtM(total)}</b><span>lineales en ${CATS.filter(c=>s[c.k]).length} anaqueles</span></div>
      <div class="cendis"><span class="lbl">Reabastecimiento del Cendis</span>
        ${s.r?`<div class="days">${DIAS.map((d,i)=>`<div class="day${s.r[i]?' on':''}${i===todayIdx?' today':''}"><b>${d.slice(0,3)}</b>${s.r[i]?esc(s.r[i]):'—'}</div>`).join('')}</div>
        ${nx?`<div class="next"><span class="pin"></span><span><b>${nx.txt}</b> · ${esc(nx.when)}</span></div>`:''}`:'<span class="sub">Sin datos de reabastecimiento para esta tienda.</span>'}
      </div>
    </section>
    <div class="cats" role="group" aria-label="Categoría">${vc.map(c => { const code = s[c.k], n = ponceIn(code);
      return `<button type="button" class="cat" data-cat="${c.k}" aria-pressed="${selCat===c.k}" ${code?'':'disabled'}><span class="cn"><span class="cdot" style="background:${cvar(c.k)}"></span>${c.name}</span><span class="cm">${code?fmtM(PL[code].width_cm):'—'}</span><span class="cf"><span class="cc">${code||'Sin asignar'}</span>${n?`<span class="cp">${n} Ponce</span>`:''}</span></button>`; }).join('')}</div>
    ${s[selCat] ? planCard(s[selCat]) : ''}
    <button type="button" class="btn back" id="back">← Volver al resumen</button>`;
}
function planView(){
  const p = PL[selPg], c = catOf(selPg), st = (STORESOF[selPg]||[]).slice().sort((a,b)=>(a.c||'').localeCompare(b.c||'','es')||a.n.localeCompare(b.n,'es'));
  return `<section class="card hero">
      <div><div class="eyebrow" style="color:${cvar(c.k)}">${c.name}</div><h2>${esc(p.name)}</h2><div class="sub"><code>${p.code}</code> · ${fmtM(p.width_cm)} de largo · ${p.modulos} módulos${p.img?' · '+p.skus+' SKU':''}${p.date?' · actualizado '+p.date:''}</div></div>
      <div class="big"><b>${st.length}</b><span>tiendas · ${nf(Math.round(st.length*p.width_cm)/100)} m lineales</span></div>
    </section>
    ${planCard(selPg, true)}
    <section class="card sec"><h3>Tiendas con este planograma</h3><p class="d">${st.length?'Toca una tienda para ver todos sus planogramas.':'Ninguna tienda tiene asignado este planograma.'}</p>
      ${st.length?`<div class="tw sc"><table><thead><tr><th>Tienda</th><th>N°</th><th>Ciudad</th><th>Días Cendis</th></tr></thead><tbody>
      ${st.map(s=>`<tr class="click" tabindex="0" data-store="${esc(s.n)}"><td><b style="font-weight:500">${esc(s.n)}</b></td><td><code>${s.id||'—'}</code></td><td>${esc(s.c||'—')}</td><td>${weekDots(s)}</td></tr>`).join('')}</tbody></table></div>`:''}
    </section>
    <button type="button" class="btn back" id="back">← Ver todos los planogramas</button>`;
}
function renderMain(){
  const m = $('#main');
  if (mode === 'plan') m.innerHTML = selPg ? planView() : summary();
  else m.innerHTML = sel ? storeView() : summary();
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.mode===mode));
  $('#sizes').hidden = mode!=='plan'; $('#trow').hidden = mode==='plan';
  $('#q').placeholder = mode==='plan' ? 'Buscar planograma o código (ej. 5A, AVIT5E)' : 'Buscar tienda o número (ej. LUZMAR, 2142)';
  $('#q').setAttribute('aria-label', mode==='plan' ? 'Buscar planograma' : 'Buscar tienda');
}
function setHash(){
  const h = mode==='plan' ? (selPg ? '#pg-'+selPg.toLowerCase() : '#planogramas') : (sel ? '#'+slug(sel.n) : '');
  if (location.hash !== h) { try { history.replaceState(null,'',h || location.pathname); } catch(_) {} }
}
function render(){ renderTabs(); renderList(); renderMain(); setHash(); }
function goStore(n){ mode='tienda'; sel = STORES.find(s=>s.n===n) || null; hiSku = null; render(); if (sel && innerWidth<=900) $('#main').scrollIntoView({behavior:'smooth'}); }
function goPg(code){ mode='plan'; selPg = code && PL[code] ? code : null; hiSku = null; render(); if (selPg && innerWidth<=900) $('#main').scrollIntoView({behavior:'smooth'}); }

/* ---------- eventos ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function renderTheme(){ const dark = document.documentElement.dataset.theme==='dark'; $('#theme').innerHTML = dark ? SUN+'Modo claro' : MOON+'Modo oscuro'; $('#theme').setAttribute('aria-label', dark?'Cambiar a modo claro':'Cambiar a modo oscuro'); }
$('#theme').addEventListener('click', () => { const nt = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nt; try{ localStorage.setItem('pb-theme', nt); }catch(_){} renderTheme(); });
renderTheme();
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b || b.dataset.mode===mode) return; mode = b.dataset.mode; $('#q').value=''; render(); });
$('#q').addEventListener('input', renderList);
$('#q').addEventListener('keydown', e => { if (e.key!=='Enter') return; if (mode==='plan'){ const r = filteredPg(); if (r.length) goPg(r[0]); } else { const r = filteredStores(); if (r.length) goStore(r[0].n); } });
$('#city').addEventListener('change', renderList); $('#dia').addEventListener('change', renderList);
$('#clear').addEventListener('click', () => { pgFilter = null; renderList(); });
$('#sizes').addEventListener('click', e => { const b = e.target.closest('[data-size]'); if (!b) return; size = b.dataset.size ? +b.dataset.size : null; renderList(); });
$('#list').addEventListener('click', e => { const g = e.target.closest('[data-pg]'); if (g) return goPg(g.dataset.pg); const b = e.target.closest('[data-n]'); if (b) goStore(b.dataset.n); });
$('#lines').addEventListener('click', e => {
  if (e.target.closest('#hitoggle')) { hiOn = !hiOn; renderLines(); renderMain(); return; }
  const b = e.target.closest('[data-line]'); if (!b) return;
  line = b.dataset.line || null; hiSku = null;
  if (line) { const vk = [...CATOF[line]]; if (!vk.includes(selCat)) selCat = vk.find(k => sel && sel[k]) || vk[0];
    if (pgFilter && !vk.includes(catOf(pgFilter).k)) pgFilter = null; if (selPg && !vk.includes(catOf(selPg).k)) selPg = null; }
  try { localStorage.setItem('pb-line', line||''); } catch(_) {}
  renderLines(); render();
});
$('#main').addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v){ view = v.dataset.view; try{localStorage.setItem('pb-view',view);}catch(_){} renderMain(); return; }
  const c = e.target.closest('[data-cat]'); if (c){ selCat = c.dataset.cat; hiSku = null; renderMain(); return; }
  const k = e.target.closest('[data-sku]'); if (k){ hiSku = hiSku===k.dataset.sku ? null : k.dataset.sku; renderMain(); return; }
  const o = e.target.closest('[data-open]'); if (o){ openViewer(o.dataset.open); return; }
  const st = e.target.closest('[data-store]'); if (st){ goStore(st.dataset.store); scrollTo({top:0,behavior:'smooth'}); return; }
  const r = e.target.closest('[data-pgrow]'); if (r){ if (mode==='plan') goPg(r.dataset.pgrow); else { pgFilter = r.dataset.pgrow; renderList(); $('#list').scrollTop = 0; } return; }
  if (e.target.closest('#back')) { if (mode==='plan') goPg(null); else goStore(null); }
});
$('#main').addEventListener('keydown', e => { const r = e.target.closest('tr[data-store]'); if (r && (e.key==='Enter'||e.key===' ')) { e.preventDefault(); r.click(); } });

let lastFocus = null;
function openViewer(code){ const p = PL[code]; lastFocus = document.activeElement;
  $('#vtitle').textContent = p.name + ' · ' + fmtM(p.width_cm); $('#vimg').src = p.img[view]; $('#vimg').alt = 'Planograma ' + p.name; $('#vhits').innerHTML = hits(code, view);
  $('#vscroll').classList.remove('real'); $('#vzoom').textContent = 'Tamaño real'; $('#viewer').hidden = false; $('#vclose').focus(); }
function closeViewer(){ $('#viewer').hidden = true; if (lastFocus) lastFocus.focus(); }
function toggleZoom(){ const r = $('#vscroll').classList.toggle('real'); $('#vzoom').textContent = r ? 'Ajustar a pantalla' : 'Tamaño real'; }
$('#vclose').addEventListener('click', closeViewer); $('#vzoom').addEventListener('click', toggleZoom); $('#vimg').addEventListener('click', toggleZoom);
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#viewer').hidden) closeViewer(); });

function fromHash(){ const h = location.hash.slice(1);
  if (h==='planogramas' || h.startsWith('pg-')) { mode='plan'; selPg = h.startsWith('pg-') && PL[h.slice(3).toUpperCase()] ? h.slice(3).toUpperCase() : null; }
  else { mode='tienda'; sel = STORES.find(x=>slug(x.n)===h) || null; }
  render(); }
window.addEventListener('hashchange', fromHash);
renderLines(); fromHash();
</script>

</body>
</html>
